name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MyCollectives.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCollectives-apk
          path: MyCollectives.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MyCollectives APK (build ${{ github.run_number }})
          body: |
            Automated debug-signed release build of MyCollectives.
            Download **MyCollectives.apk** below, open it on your Android phone, and allow "install from unknown sources" to install.
          files: MyCollectives.apk
